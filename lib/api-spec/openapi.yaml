openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: My Skins API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: projects
    description: Project management
  - name: ai
    description: AI generation features
  - name: exports
    description: Export operations
  - name: roblox
    description: Roblox integration
  - name: share
    description: Sharing features
  - name: dashboard
    description: Dashboard aggregates

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /projects:
    get:
      operationId: getProjects
      tags: [projects]
      summary: List user's projects
      parameters:
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
        - name: type
          in: query
          schema:
            type: string
            enum: [shirt, pants]
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a specific project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /projects/{id}/duplicate:
    post:
      operationId: duplicateProject
      tags: [projects]
      summary: Duplicate a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Duplicated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}/canvas:
    put:
      operationId: saveCanvas
      tags: [projects]
      summary: Save canvas state for a project
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveCanvasRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/recent:
    get:
      operationId: getRecentProjects
      tags: [dashboard]
      summary: Get recent projects for dashboard
      responses:
        "200":
          description: Recent projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"

  /ai/generate:
    post:
      operationId: aiGenerateDesign
      tags: [ai]
      summary: Generate canonical AI design payload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
      responses:
        "200":
          description: Generated design response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDesignResponse"

  /ai/generate-idea:
    post:
      operationId: aiGenerateIdea
      tags: [ai]
      summary: Generate AI concept summary
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
      responses:
        "200":
          description: Generated idea response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiIdea"

  /ai/improve:
    post:
      operationId: aiImproveDesign
      tags: [ai]
      summary: Improve an existing AI design
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiImproveRequest"
      responses:
        "200":
          description: Improved design response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDesignResponse"

  /ai/remix:
    post:
      operationId: aiRemixDesign
      tags: [ai]
      summary: Remix an existing AI design
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiImproveRequest"
      responses:
        "200":
          description: Remixed design response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDesignResponse"

  /ai/generate-modules:
    post:
      operationId: aiGenerateModules
      tags: [ai]
      summary: Generate modules for an item type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
      responses:
        "200":
          description: Generated modules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiModules"

  /ai/generate-palette:
    post:
      operationId: aiGeneratePalette
      tags: [ai]
      summary: Generate color palette for an item type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
      responses:
        "200":
          description: Generated palette
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiPalette"

  /ai/generate-layout:
    post:
      operationId: aiGenerateLayout
      tags: [ai]
      summary: Generate placement/layout notes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiGenerateRequest"
      responses:
        "200":
          description: Generated layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiLayout"

  /ai/history:
    get:
      operationId: getAiHistory
      tags: [ai]
      summary: Get AI generation history
      responses:
        "200":
          description: AI generation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AiHistoryEntry"

  /exports:
    post:
      operationId: createExport
      tags: [exports]
      summary: Create an export lifecycle job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportRequest"
      responses:
        "201":
          description: Export job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
    get:
      operationId: getExports
      tags: [exports]
      summary: List export lifecycle jobs
      responses:
        "200":
          description: Export lifecycle jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExportJob"

  /exports/{jobId}:
    get:
      operationId: getExportJob
      tags: [exports]
      summary: Get a specific export lifecycle job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Export lifecycle job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJob"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /billing/state:
    get:
      operationId: getBillingState
      tags: [dashboard]
      summary: Get current billing lifecycle state
      responses:
        "200":
          description: Billing lifecycle state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingState"

  /roblox/status:
    get:
      operationId: getRobloxStatus
      tags: [roblox]
      summary: Get Roblox integration connection status
      responses:
        "200":
          description: Roblox status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobloxStatus"

  /roblox/login:
    get:
      operationId: getRobloxLogin
      tags: [roblox]
      summary: Create Roblox OAuth login URL with PKCE
      responses:
        "200":
          description: Roblox OAuth login URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobloxLoginUrl"

  /roblox/callback:
    get:
      operationId: robloxCallback
      tags: [roblox]
      summary: Complete Roblox OAuth callback
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Roblox connection established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobloxCallbackResponse"

  /roblox/upload:
    post:
      operationId: createRobloxUpload
      tags: [roblox]
      summary: Create a Roblox upload lifecycle job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRobloxUploadRequest"
      responses:
        "202":
          description: Roblox upload job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobloxUploadJob"

  /roblox/upload/{uploadJobId}:
    get:
      operationId: getRobloxUpload
      tags: [roblox]
      summary: Get Roblox upload lifecycle job
      parameters:
        - name: uploadJobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Roblox upload lifecycle job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RobloxUploadJob"

  /roblox/disconnect:
    delete:
      operationId: disconnectRoblox
      tags: [roblox]
      summary: Disconnect Roblox account
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /share:
    post:
      operationId: createShareLink
      tags: [share]
      summary: Create a share link for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Share link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareLink"

  /share/{token}:
    get:
      operationId: getSharedProject
      tags: [share]
      summary: Get a shared project by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedProjectView"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        username:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        language:
          type: string
        timezone:
          type: string
        plan:
          type: string
          enum: [free, pro]
        aiCredits:
          type: number
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - plan
        - aiCredits
        - createdAt


    AuthUser:
      allOf:
        - $ref: "#/components/schemas/User"

    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
        language:
          type: string
        timezone:
          type: string

    Project:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [shirt, pants]
        thumbnailUrl:
          type: string
        canvasData:
          type: string
        isPublic:
          type: boolean
        isAiGenerated:
          type: boolean
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - type
        - isPublic
        - isAiGenerated
        - createdAt
        - updatedAt

    ProjectList:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        total:
          type: number
        page:
          type: number
        limit:
          type: number
      required:
        - projects
        - total
        - page
        - limit

    CreateProjectRequest:
      type: object
      properties:
        title:
          type: string
        type:
          type: string
          enum: [shirt, pants]
        isAiGenerated:
          type: boolean
      required:
        - title
        - type

    UpdateProjectRequest:
      type: object
      properties:
        title:
          type: string
        isPublic:
          type: boolean
        tags:
          type: array
          items:
            type: string

    SaveCanvasRequest:
      type: object
      properties:
        canvasData:
          type: string
        thumbnailUrl:
          type: string
      required:
        - canvasData

    DashboardSummary:
      type: object
      properties:
        totalProjects:
          type: number
        shirtProjects:
          type: number
        pantsProjects:
          type: number
        totalExports:
          type: number
        aiGenerations:
          type: number
        robloxConnected:
          type: boolean
      required:
        - totalProjects
        - shirtProjects
        - pantsProjects
        - totalExports
        - aiGenerations
        - robloxConnected

    AiItemType:
      type: string
      enum: [classic_shirt, classic_pants]

    AiLifecycleStatus:
      type: string
      enum: [queued, processing, completed, degraded, failed]

    AiGenerateRequest:
      type: object
      properties:
        prompt:
          type: string
        itemType:
          $ref: "#/components/schemas/AiItemType"
        style:
          type: string
        theme:
          type: string
      required: [prompt, itemType]

    AiDesignModule:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        color: { type: string, pattern: "^#([0-9a-fA-F]{6})$" }
        position:
          type: object
          properties:
            x: { type: number }
            y: { type: number }
          required: [x, y]
        scale: { type: number }
        rotation: { type: number }
        opacity: { type: number }
        layer: { type: number }
      required: [id, type, label, color, position, scale, rotation, opacity, layer]

    AiPlacement:
      type: object
      properties:
        front: { type: string }
        back: { type: string }
        leftSleeve: { type: string }
        rightSleeve: { type: string }
        leftLeg: { type: string }
        rightLeg: { type: string }
      required: [front, back, leftSleeve, rightSleeve, leftLeg, rightLeg]

    AiEditorInstructions:
      type: object
      properties:
        baseTemplate: { type: string }
        recommendedPreset: { type: string }
        notes:
          type: array
          items: { type: string }
      required: [baseTemplate, recommendedPreset, notes]

    AiDesign:
      type: object
      properties:
        title: { type: string }
        itemType:
          $ref: "#/components/schemas/AiItemType"
        style: { type: string }
        target: { type: string, enum: [roblox] }
        theme: { type: string }
        colorPalette:
          type: array
          items: { type: string, pattern: "^#([0-9a-fA-F]{6})$" }
        designElements:
          type: array
          items: { type: string }
        placement:
          $ref: "#/components/schemas/AiPlacement"
        modules:
          type: array
          items:
            $ref: "#/components/schemas/AiDesignModule"
        editorInstructions:
          $ref: "#/components/schemas/AiEditorInstructions"
      required: [title, itemType, style, target, theme, colorPalette, designElements, placement, modules, editorInstructions]

    AiResponseMeta:
      type: object
      properties:
        generationId: { type: string }
        status:
          $ref: "#/components/schemas/AiLifecycleStatus"
        warnings:
          type: array
          items: { type: string }
        deprecated:
          type: boolean
      required: [generationId, status, warnings]

    AiDesignResponse:
      type: object
      properties:
        meta:
          $ref: "#/components/schemas/AiResponseMeta"
        result:
          $ref: "#/components/schemas/AiDesign"
      required: [meta, result]

    AiImproveRequest:
      type: object
      properties:
        instruction: { type: string }
        design:
          $ref: "#/components/schemas/AiDesign"
      required: [instruction, design]

    AiIdea:
      type: object
      properties:
        title: { type: string }
        itemType:
          $ref: "#/components/schemas/AiItemType"
        style: { type: string }
        theme: { type: string }
        summary: { type: string }
        colorPalette:
          type: array
          items: { type: string, pattern: "^#([0-9a-fA-F]{6})$" }
        designElements:
          type: array
          items: { type: string }
      required: [title, itemType, style, theme, summary, colorPalette, designElements]

    AiModules:
      type: object
      properties:
        itemType:
          $ref: "#/components/schemas/AiItemType"
        modules:
          type: array
          items:
            $ref: "#/components/schemas/AiDesignModule"
      required: [itemType, modules]

    AiPalette:
      type: object
      properties:
        itemType:
          $ref: "#/components/schemas/AiItemType"
        paletteName: { type: string }
        colors:
          type: array
          items: { type: string, pattern: "^#([0-9a-fA-F]{6})$" }
        usageNotes:
          type: array
          items: { type: string }
      required: [itemType, paletteName, colors, usageNotes]

    AiLayout:
      type: object
      properties:
        itemType:
          $ref: "#/components/schemas/AiItemType"
        placement:
          $ref: "#/components/schemas/AiPlacement"
        notes:
          type: array
          items: { type: string }
      required: [itemType, placement, notes]

    AiHistoryEntry:
      type: object
      properties:
        id:
          type: string
        prompt:
          type: string
        style:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AiLifecycleStatus"
        result:
          $ref: "#/components/schemas/AiDesign"
      required: [id, prompt, createdAt, status, result]

    CreateExportRequest:
      type: object
      properties:
        projectId:
          type: string
        format:
          type: string
          enum: [png]
        quality:
          type: string
          enum: [standard, high]
      required:
        - projectId
        - format

    ExportLifecycleStatus:
      type: string
      enum: [queued, processing, completed, failed]

    ExportArtifact:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        width:
          type: number
        height:
          type: number
        size:
          type: number
      required: [id, url, width, height]

    ExportJob:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        format:
          type: string
          enum: [png]
        status:
          $ref: "#/components/schemas/ExportLifecycleStatus"
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        artifact:
          oneOf:
            - $ref: "#/components/schemas/ExportArtifact"
            - type: "null"
      required: [jobId, projectId, format, status, createdAt, completedAt, artifact]

    BillingSubscription:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        providerSubscriptionId: { type: string }
        status: { type: string }
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, userId, providerSubscriptionId, status, currentPeriodEnd, createdAt]

    BillingEntitlement:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        key: { type: string }
        source: { type: string }
        status: { type: string }
        createdAt:
          type: string
          format: date-time
      required: [id, userId, key, source, status, createdAt]

    BillingInvoice:
      type: object
      properties:
        id: { type: string }
        subscriptionId:
          type: string
          nullable: true
        providerInvoiceId: { type: string }
        status: { type: string }
        amountPaid: { type: number }
        createdAt:
          type: string
          format: date-time
      required: [id, subscriptionId, providerInvoiceId, status, amountPaid, createdAt]

    BillingState:
      type: object
      properties:
        plans:
          type: array
          items:
            type: string
        subscription:
          oneOf:
            - $ref: "#/components/schemas/BillingSubscription"
            - type: "null"
        entitlements:
          type: array
          items:
            $ref: "#/components/schemas/BillingEntitlement"
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/BillingInvoice"
      required: [plans, subscription, entitlements, invoices]

    RobloxStatus:
      type: object
      properties:
        configured:
          type: boolean
        connected:
          type: boolean
        connection:
          type: object
          nullable: true
          properties:
            robloxUserId: { type: string }
            robloxUsername: { type: string }
            connectedAt:
              type: string
              format: date-time
          required: [robloxUserId, robloxUsername, connectedAt]
      required: [configured, connected, connection]

    RobloxLoginUrl:
      type: object
      properties:
        authorizeUrl:
          type: string
      required: [authorizeUrl]

    RobloxCallbackResponse:
      type: object
      properties:
        success:
          type: boolean
        connected:
          type: boolean
      required: [success, connected]

    RobloxUploadStatus:
      type: string
      enum: [queued, processing, completed, failed, blocked]

    RobloxUploadEvent:
      type: object
      properties:
        id: { type: string }
        uploadJobId: { type: string }
        status:
          $ref: "#/components/schemas/RobloxUploadStatus"
        message: { type: string }
        createdAt:
          type: string
          format: date-time
      required: [id, uploadJobId, status, message, createdAt]

    CreateRobloxUploadRequest:
      type: object
      properties:
        projectId:
          type: string
      required: [projectId]

    RobloxUploadJob:
      type: object
      properties:
        uploadJobId:
          type: string
        projectId:
          type: string
        status:
          $ref: "#/components/schemas/RobloxUploadStatus"
        events:
          type: array
          items:
            $ref: "#/components/schemas/RobloxUploadEvent"
      required: [uploadJobId, projectId, status, events]

    CreateShareRequest:
      type: object
      properties:
        projectId:
          type: string
        isPublic:
          type: boolean
      required:
        - projectId

    ShareLink:
      type: object
      properties:
        id:
          type: string
        token:
          type: string
        projectId:
          type: string
        isPublic:
          type: boolean
        url:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - token
        - projectId
        - isPublic
        - createdAt

    SharedProjectView:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/Project"
        author:
          type: object
          properties:
            displayName:
              type: string
            username:
              type: string
          required:
            - displayName
      required:
        - project
        - author
