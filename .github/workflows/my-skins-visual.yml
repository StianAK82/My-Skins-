name: My Skins visual evidence
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA, branch, or tag to render (defaults to the selected workflow ref)"
        required: false
        type: string
  pull_request:
    paths:
      [
        "artifacts/my-skins/**",
        "artifacts/api-server/**",
        "visual-tests/**",
        "playwright.config.ts",
        ".github/workflows/my-skins-visual.yml",
      ]
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      VITE_ENABLE_VISUAL_TESTS: "true"
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Report rendered source
        env:
          TARGET_REF: ${{ inputs.target_sha }}
        run: |
          echo "Rendering commit $(git rev-parse HEAD)"
          if [ -n "$TARGET_REF" ]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$TARGET_REF^{commit}")"
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Runtime diagnostics
        run: |
          node --version
          pnpm --version
          node -e "console.log(require('v8').getHeapStatistics().heap_size_limit)"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser availability
        run: |
          pnpm exec playwright --version
          test -x "$(pnpm exec playwright install --dry-run chromium | sed -n 's/^  Install location: //p' | head -1)/chrome-linux/chrome" || \
            node -e "const { chromium } = require('@playwright/test'); chromium.launch().then(async b => { console.log('Chromium', b.version()); await b.close(); }).catch(e => { console.error(e); process.exit(1); })"
      - name: Typecheck workspace once
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run integration tests
        run: pnpm test:integration
      - name: Build workspace without repeating typecheck
        run: pnpm run build:packages
      - name: Run rendering and screenshot tests
        run: pnpm exec playwright test
      - name: Verify visual evidence set
        run: |
          test -f test-results/visual-evidence.json
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const evidence = JSON.parse(readFileSync("test-results/visual-evidence.json", "utf8"));
          if (evidence.screenshots.length !== evidence.expectedCount) {
            throw new Error(`Expected ${evidence.expectedCount} screenshots, found ${evidence.screenshots.length}`);
          }
          console.log(`Verified ${evidence.screenshots.length} representative screenshots`);
          NODE
          missing=0
          while IFS= read -r screenshot; do
            if [ ! -s "$screenshot" ]; then
              echo "Missing or empty screenshot: $screenshot" >&2
              missing=1
            fi
          done < <(node -e 'const e=require("./test-results/visual-evidence.json"); for (const s of e.screenshots) console.log(s.path)')
          test "$missing" -eq 0
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-skins-screenshots
          path: |
            test-results/screenshots/**
            test-results/visual-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-skins-diffs
          path: "test-results/**/*diff.png"
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-skins-playwright-report
          path: |
            playwright-report/**
            test-results/playwright/**
          if-no-files-found: error
          retention-days: 30
