name: My Skins visual evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      [
        "artifacts/my-skins/**",
        "artifacts/api-server/**",
        "visual-tests/**",
        "playwright.config.ts",
        ".github/workflows/my-skins-visual.yml",
      ]
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      VITE_ENABLE_VISUAL_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Runtime diagnostics
        run: |
          node --version
          pnpm --version
          node -e "console.log(require('v8').getHeapStatistics().heap_size_limit)"
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Typecheck workspace once
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test:unit
      - name: Run integration tests
        run: pnpm test:integration
      - name: Build workspace without repeating typecheck
        run: pnpm run build:packages
      - name: Run rendering and screenshot tests
        run: pnpm exec playwright test
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          {
            name: my-skins-screenshots,
            path: "test-results/screenshots/**",
            if-no-files-found: warn,
          }
      - name: Upload screenshot diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          {
            name: my-skins-diffs,
            path: "test-results/**/*diff.png",
            if-no-files-found: ignore,
          }
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          {
            name: my-skins-playwright-report,
            path: "test-results/playwright-report/**",
            if-no-files-found: warn,
          }
